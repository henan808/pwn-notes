# ------------------------------------------------------------------
# Fluid 主题覆盖配置：只写要改的项，其余沿用主题默认
# 完整默认配置见 node_modules/hexo-theme-fluid/_config.yml
# ------------------------------------------------------------------

navbar:
  blog_title: "Pwn Notes"
  ground_glass:
    enable: true
    px: 3
    alpha: 0.85
  menu:
    - { key: "home", name: "首页", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", name: "归档", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", name: "分类", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", name: "标签", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", name: "关于", link: "/about/", icon: "iconfont icon-user-fill" }

search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

dark_mode:
  enable: true
  default: auto

code:
  copy_btn: true
  language:
    enable: true
    default: "TEXT"
  highlight:
    enable: true
    line_number: true
    lib: "highlightjs"
    highlightjs:
      style: "github"
      style_dark: "dark"

post:
  meta:
    author:
      enable: true
    date:
      enable: true
      format: "YYYY-MM-DD HH:mm"
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 60
  toc:
    enable: true
    expand_all: true
    placement: right
  category_bar:
    enable: true
    specific: false
    placement: left
  copyright:
    enable: true
    license: 'BY-NC-SA'
  # 配合 hexo-filter-mermaid-diagrams：文章里写 ```mermaid 代码块即可画堆布局图
  mermaid:
    enable: true
    specific: false
    options: { theme: 'default' }
  comments:
    enable: false

category:
  enable: true
  order_by: "-length"
  collapse_depth: 1
  post_order_by: "-date"
  post_limit: 0

tag:
  enable: true

about:
  enable: true
  avatar: /img/avatar.png
  name: "Pwn Notes"
  intro: "堆、栈、格式化字符串与题目复现 · 个人学习笔记"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/henan808", tip: "GitHub" }
    - { class: "iconfont icon-link-fill", link: "https://github.com/henan808/pwn-notes", tip: "本站源码" }
